# Staging: staging-rostagro.skladyx.ru (сервер sklad-prod-01, путь /opt/skladyx-staging).
# Полностью независим от prod: своё имя compose-проекта (skladyx-staging), свои volume
# (skladyx_staging_*), свой .env, порт приложения только на 127.0.0.1:3013 (снаружи
# nginx reverse proxy + SSL для staging-домена). Данные — только seed, prod DB не копируем.
name: skladyx-staging
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skladyx
      POSTGRES_PASSWORD: "${DB_PASSWORD:?задайте DB_PASSWORD в .env}"
      POSTGRES_DB: skladyx
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skladyx -d skladyx"]
      interval: 5s
      timeout: 5s
      retries: 10
    # порт наружу не публикуем — доступ только из compose-сети

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://skladyx:${DB_PASSWORD}@db:5432/skladyx?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?задайте AUTH_SECRET в .env}"
      APP_URL: "${APP_URL:-https://staging-rostagro.skladyx.ru}"
      DEFAULT_ORG_SLUG: "${DEFAULT_ORG_SLUG:-rostagro}"
      VAPID_PUBLIC: "${VAPID_PUBLIC:-}"
      VAPID_PRIVATE: "${VAPID_PRIVATE:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      UPLOAD_DIR: /data/uploads
      SEED_ON_START: "${SEED_ON_START:-false}"
      SEED_COMPANY_NAME: "${SEED_COMPANY_NAME:-}"
      SEED_COMPANY_SLUG: "${SEED_COMPANY_SLUG:-rostagro}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-}"
      SEED_ADMIN_PHONE: "${SEED_ADMIN_PHONE:-}"
      SEED_ADMIN_NAME: "${SEED_ADMIN_NAME:-}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:3013:3000"

volumes:
  db_data:
    name: skladyx_staging_db_data
  uploads:
    name: skladyx_staging_uploads
